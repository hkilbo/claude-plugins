<script id="hk-common-js">
window.hkCommon = (function () {
  const root = document.documentElement;
  const TOP_PX = 8;
  const SCROLL_DIR_PX = 24;
  const CREDITS_RATIO = 0.4;
  const WHITE = [255, 255, 255];
  const wrapper = () => document.querySelector(".body-wrapper");
  function setCommon(attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null) delete root.dataset[k];
      else if (root.dataset[k] !== v) root.dataset[k] = v;
    }
  }
  function placeByline(target) {
    const byline = document.querySelector(".byline");
    if (byline && target && byline.parentElement !== target) target.append(byline);
    return byline;
  }
  function wireScrollFlow(credits) {
    const scroller = wrapper();
    if (!scroller) return;
    const byline = credits === "bottom" ? document.querySelector(".byline") : null;
    const reached = () =>
      byline.getBoundingClientRect().top <= scroller.clientHeight * (1 - CREDITS_RATIO) ||
      scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 2;
    let last = scroller.scrollTop;
    const update = () => {
      const y = scroller.scrollTop;
      const inCredits = root.dataset.state === "credits";
      if (byline && reached()) setCommon({ state: "credits", gnb: "solid" });
      else if (!byline && inCredits) last = y;
      else if (y <= TOP_PX) setCommon({ state: "intro", gnb: "transparent" });
      else if (inCredits) setCommon({ state: "play", gnb: "solid" });
      else if (root.dataset.state === "intro") setCommon({ state: "play", gnb: "hidden" });
      else if (Math.abs(y - last) < SCROLL_DIR_PX) return;
      else setCommon({ state: "play", gnb: y > last ? "hidden" : "solid" });
      last = y;
    };
    scroller.addEventListener("scroll", update, { passive: true });
    if (byline) {
      window.addEventListener("load", update);
      window.addEventListener("resize", update);
    }
  }
  function showCredits(target) {
    const holder = document.querySelector(".byline-holder");
    if (target) placeByline(target);
    else if (holder) holder.hidden = false;
    setCommon({ state: "credits", gnb: "solid" });
  }
  function hideCredits() {
    const holder = document.querySelector(".byline-holder");
    if (holder) holder.hidden = true;
    placeByline(holder);
    const y = wrapper()?.scrollTop ?? 0;
    setCommon(y <= TOP_PX ? { state: "intro", gnb: "transparent" } : { state: "play", gnb: "solid" });
  }
  function onRecommend(cb) {
    const listener = (e) => cb(e.detail.state);
    document.addEventListener("hk-interactive-recommend", listener);
    return () => document.removeEventListener("hk-interactive-recommend", listener);
  }
  const ctx = document.createElement("canvas").getContext("2d", { willReadFrequently: true });
  function toRgba(color) {
    ctx.clearRect(0, 0, 1, 1);
    ctx.fillStyle = color;
    ctx.fillRect(0, 0, 1, 1);
    return [...ctx.getImageData(0, 0, 1, 1).data];
  }
  function readBgColor(els) {
    let seen = [0, 0, 0, 0];
    for (const el of els) {
      const [r, g, b, a255] = toRgba(getComputedStyle(el).backgroundColor);
      const a = a255 / 255;
      if (!a) continue;
      const gap = 1 - seen[3];
      seen = [r, g, b].map((c, i) => seen[i] + c * a * gap).concat(seen[3] + a * gap);
      if (seen[3] >= 0.999) break;
    }
    if (!seen[3]) return null;
    return [0, 1, 2].map((i) => seen[i] + WHITE[i] * (1 - seen[3]));
  }
  function isLight([r, g, b]) {
    const lin = (c) => ((c /= 255) <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4);
    return 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b) > 0.179;
  }
  function wireTheme() {
    const els = [wrapper(), document.body, root].filter(Boolean);
    const themeColor = document.querySelector('meta[name="theme-color"]');
    const apply = () => {
      const c = readBgColor(els) ?? WHITE;
      setCommon({ theme: isLight(c) ? "light" : "dark" });
      themeColor?.setAttribute("content", `rgb(${c.map(Math.round).join(",")})`);
    };
    apply();
    const mo = new MutationObserver(apply);
    for (const el of els) {
      mo.observe(el, { attributes: true, attributeFilter: ["class", "style"] });
      el.addEventListener("transitionend", (e) => e.target === el && apply());
    }
  }
  function removeLoader() {
    document.body.classList.remove("loading");
    document.body.classList.add("loaded");
  }
  function createPause({ onChange } = {}) {
    const reasons = new Set();
    return {
      hold(reason, on) {
        const before = reasons.size > 0;
        on ? reasons.add(reason) : reasons.delete(reason);
        if (before !== reasons.size > 0) onChange?.(reasons.size > 0);
      },
      get paused() { return reasons.size > 0; },
      get reasons() { return [...reasons]; },
    };
  }
  const credits = root.dataset.credits === "end" ? "end" : "bottom";
  const byline = document.querySelector(".byline");
  if (credits === "end" && byline) {
    const holder = Object.assign(document.createElement("div"), { className: "byline-holder", hidden: true });
    byline.before(holder);
    holder.append(byline);
  }
  wireTheme();
  wireScrollFlow(credits);
  document.addEventListener("click", (e) => {
    const button = e.target.closest("[data-share]");
    if (!button) return;
    const url = encodeURIComponent(location.origin + location.pathname);
    const sns = button.dataset.share;
    if (sns === "fb") window.open("https://www.facebook.com/sharer/sharer.php?u=" + url, "_blank");
    else if (sns === "twt") window.open("https://twitter.com/intent/tweet?text=" + encodeURIComponent(document.title) + "%20" + url, "_blank");
    else if (sns === "url") {
      if (navigator.clipboard?.writeText) navigator.clipboard.writeText(location.href).then(() => alert("주소가 복사되었습니다."), () => alert("복사 실패!"));
      else alert("복사 실패!");
    }
  });
  document.addEventListener("touchmove", (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  const pageLoaded = document.readyState === "complete" ? Promise.resolve() : new Promise((r) => window.addEventListener("load", r, { once: true }));
  Promise.all([pageLoaded, document.fonts ? document.fonts.ready : Promise.resolve()]).then(removeLoader);
  return { setCommon, placeByline, showCredits, hideCredits, onRecommend, createPause, removeLoader };
})();
</script>
